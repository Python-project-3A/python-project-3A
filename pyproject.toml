[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
exclude = ["venv", ".venv", "build", "dist"]

target-version = "py312"

lint.select = ["E", "F", "I", "B", "UP", "C90"]

lint.ignore = ["E501"]

fix = true

line-length = 250

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
indent-style = "space"
